<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open bill in Billy</title>
  <link rel="icon" type="image/png" href="/favicon.png" /><link rel="apple-touch-icon" href="/apple-touch-icon.png" /><meta name="theme-color" content="#184D38" />
  <style>
    :root { --ink:#0A0A0A; --muted:#737373; --green:#065F46; --bg:#F2F2F2; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:var(--bg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); padding:16px; }
    .card { background:#fff; border-radius:24px; padding:28px 24px; max-width:380px; width:100%; text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,.08); }
    .logo { display:block; width:64px; height:64px; margin:0 auto 12px; }
    h1 { font-size:20px; margin:0 0 6px; }
    p { color:var(--muted); font-size:14px; line-height:1.45; margin:0 0 20px; }
    a.btn { display:block; background:var(--green); color:#fff; text-decoration:none; font-weight:700;
      padding:14px; border-radius:14px; font-size:15px; }
    small { display:block; color:var(--muted); margin-top:14px; font-size:12px; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/logo.png" width="64" height="64" alt="Billy logo" />
    <h1>Open this bill in Billy</h1>
    <p>Every bill matters. Tap below to see the bill, your share and who has paid.</p>
    <a class="btn" id="open" href="#">Open in Billy</a>
    <small>Don't have Billy yet? Ask the person who shared this bill.</small>
  </div>
  <script>
    // /bill/<id>  →  the app's own link: mobile://group/<id>
    // /bill/<id>?c=<invite code>  →  the app's own link: mobile://bill/<id>?c=<code>
    var id = decodeURIComponent(location.pathname.replace(/^\/bill\/?/, "").replace(/\/$/, ""));
    var code = new URLSearchParams(location.search).get("c");
    var path = "bill/" + encodeURIComponent(id) + (code ? "?c=" + encodeURIComponent(code) : "");
    var appLink = "mobile://" + path;
    // Android Chrome: an intent:// link opens the installed app directly.
    var intentLink = "intent://" + path + "#Intent;scheme=mobile;package=com.billy.matters;end";
    var isAndroid = /Android/i.test(navigator.userAgent);
    var link = isAndroid ? intentLink : appLink;
    document.getElementById("open").href = link;
    if (id) { setTimeout(function () { location.href = link; }, 300); }
  </script>
</body>
</html>
